name: CI — Feature Branch Validation

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'migrations/**'
      - 'rollbacks/**'
      - 'packages/**'
      - 'schema/**'
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'

jobs:
  validate:
    name: Feature Branch Pre-PR Validation
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Gate G2: Shell Script Validation"
        shell: bash
        run: |
          echo "::group::G2 — Shell Script Validation"
          ERRORS=0
          SCRIPTS=$(find scripts/ -name "*.sh" 2>/dev/null)
          if [ -z "$SCRIPTS" ]; then
            echo "No shell scripts found — skipping"
          else
            while IFS= read -r f; do
              echo "Checking: $f"
              FIRST_LINE=$(head -1 "$f")
              if [[ "$FIRST_LINE" != "#!/bin/bash"* && "$FIRST_LINE" != "#!/bin/sh"* ]]; then
                echo "::error file=$f::Missing shebang (#!/bin/bash) on first line"
                ERRORS=$((ERRORS+1))
              else
                echo "  ✓ Shebang present"
              fi
              if grep -qiE "(password|secret|token)\s*=\s*['\"][^'\"]+['\"]" "$f"; then
                echo "::error file=$f::Hardcoded credentials detected"
                ERRORS=$((ERRORS+1))
              else
                echo "  ✓ No hardcoded credentials"
              fi
              BASENAME=$(basename "$f")
              if [[ ! "$BASENAME" =~ ^[a-z][a-z0-9_]*\.sh$ ]]; then
                echo "::error file=$f::Naming violation: use lowercase with underscores"
                ERRORS=$((ERRORS+1))
              else
                echo "  ✓ Naming convention OK"
              fi
            done <<< "$SCRIPTS"
          fi
          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then echo "::error::G2 FAILED: $ERRORS issue(s)"; exit 1; fi

      - name: "Gate G3: Migration Naming Validation"
        shell: bash
        run: |
          echo "::group::G3 — Migration Naming Convention"
          ERRORS=0
          FILES=$(find migrations/releases -name "*.xml" -o -name "*.sql" 2>/dev/null)
          if [ -z "$FILES" ]; then echo "No migration files — skipping"
          else
            while IFS= read -r f; do
              filename=$(basename "$f")
              if [[ ! "$filename" =~ ^[0-9]{3}- ]]; then
                echo "::error file=$f::Naming violation: must match NNN-description"
                ERRORS=$((ERRORS+1))
              else echo "✓ $f"; fi
            done <<< "$FILES"
          fi
          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: "Gate G4: Rollback Defined in ChangeSets"
        shell: bash
        run: |
          echo "::group::G4 — Rollback Existence"
          ERRORS=0
          XML_FILES=$(find migrations/releases -name "*.xml" 2>/dev/null)
          if [ -z "$XML_FILES" ]; then echo "No XML changelogs — skipping"
          else
            while IFS= read -r f; do
              if grep -q "<changeSet" "$f"; then
                if grep -q "<rollback>" "$f" || grep -q "rollback>" "$f"; then
                  echo "✓ $f — rollback defined"
                else
                  echo "::error file=$f::No rollback tag found"
                  ERRORS=$((ERRORS+1))
                fi
              fi
            done <<< "$XML_FILES"
          fi
          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: "Gate G5: Security Scan"
        shell: bash
        run: |
          echo "::group::G5 — Security Scanning"
          SECRETS=$(grep -riE "(password|secret|api_key|token)\s*[:=]\s*['\"][^'\"]+['\"]" \
            migrations/ rollbacks/ packages/ scripts/ data/ \
            --include="*.sql" --include="*.xml" --include="*.sh" --include="*.csv" -l 2>/dev/null || true)
          if [ -z "$SECRETS" ]; then echo "✓ No hardcoded credentials detected"
          else echo "::error::Potential credentials found in:"; echo "$SECRETS"; echo "::endgroup::"; exit 1; fi
          echo "::endgroup::"

      - name: "Gate G8: Dependency Order Validation"
        shell: bash
        run: |
          echo "::group::G8 — Dependency Order"
          MASTER="migrations/db.changelog-master.xml"
          if [ ! -f "$MASTER" ]; then echo "::error::Master changelog not found"; exit 1; fi
          ERRORS=0
          INCLUDES=$(grep -oP 'file="[^"]*"' "$MASTER" | sed 's/file="//;s/"//')
          for inc in $INCLUDES; do
            full_path="migrations/$inc"
            if [ -f "$full_path" ]; then echo "✓ $inc exists"
            else echo "::error::Referenced file not found: $inc"; ERRORS=$((ERRORS+1)); fi
          done
          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: "Gate G26: APEX Export Integrity"
        shell: bash
        run: |
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ]; then echo "No APEX export — skipping"; exit 0; fi
          echo "::group::G26 — APEX Export Integrity"
          ERRORS=0
          if [ -f "$APEX_DIR/install.sql" ]; then echo "✓ install.sql exists"
          else echo "::error::install.sql missing"; ERRORS=$((ERRORS+1)); fi
          ENV_URLS=$(grep -riE "https?://(dev|sit|uat|prod)" "$APEX_DIR" -l 2>/dev/null || true)
          if [ -z "$ENV_URLS" ]; then echo "✓ No hardcoded environment URLs"
          else echo "::error::Environment URLs found: $ENV_URLS"; ERRORS=$((ERRORS+1)); fi
          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then exit 1; fi

      - name: "Feature Validation Summary"
        if: always()
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  FEATURE BRANCH VALIDATION COMPLETE"
          echo "════════════════════════════════════════════════════"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Gates: G2, G3, G4, G5, G8, G26"
          echo "════════════════════════════════════════════════════"
