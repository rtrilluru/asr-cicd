# ============================================================
# ASR CI/CD PIPELINE — CD: Deploy to UAT
# ============================================================
# Triggers:
#   1. Push to 'uat' branch (auto-deploy on merge from sit)
#   2. Manual (workflow_dispatch)
# Runs on: Self-hosted runner (EC2)
# Flow: Run ALL SQL scripts → Validate → Smoke + Data Tests
# ============================================================

name: CD — Deploy to UAT

on:
  push:
    branches:
      - uat
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'

  workflow_dispatch:

concurrency:
  group: deploy-uat
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to UAT Database
    runs-on: self-hosted
    environment: DB-UAT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────
      # Deploy ALL SQL scripts (full sync to UAT)
      # ────────────────────────────────────────────────────────
      - name: "Deploy SQL Scripts"
        id: deploy
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Deploy ALL SQL Scripts to UAT"
          ERRORS=0

          for TYPE in ddl packages functions procedures triggers views; do
            SCRIPTS=$(find scripts/${TYPE}/ -name "*.sql" 2>/dev/null | sort)
            if [ -n "$SCRIPTS" ]; then
              echo "── Deploying ${TYPE} ──"
              # DDL scripts: ignore "already exists" errors for idempotent re-runs
              if [ "$TYPE" = "ddl" ]; then
                ORA_EXCLUDE="ORA-17110|ORA-01430|ORA-00955|ORA-01442|ORA-02275|ORA-02261|ORA-01408"
              else
                ORA_EXCLUDE="ORA-17110"
              fi
              while IFS= read -r script; do
                echo "  Running: $script"
                OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          SET ECHO ON
          SET SERVEROUTPUT ON
          @${script}
          EXIT
          EOSQL
                )
                echo "$OUTPUT"
                if echo "$OUTPUT" | grep -viE "$ORA_EXCLUDE" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
                  echo "::error file=$script::Deployment failed"
                  ERRORS=$((ERRORS+1))
                else
                  echo "  ✓ $script deployed"
                fi
              done <<< "$SCRIPTS"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS script(s) failed to deploy"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ All scripts deployed to UAT"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Object Validity
      # ────────────────────────────────────────────────────────
      - name: "Object Validity Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Object Validity"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_invalid NUMBER;
          BEGIN
              DBMS_UTILITY.COMPILE_SCHEMA(schema => USER, compile_all => FALSE);
              SELECT COUNT(*) INTO v_invalid FROM user_objects WHERE status != 'VALID';
              IF v_invalid > 0 THEN
                  FOR rec IN (SELECT object_type, object_name FROM user_objects WHERE status != 'VALID') LOOP
                      DBMS_OUTPUT.PUT_LINE('  INVALID: ' || rec.object_type || ' — ' || rec.object_name);
                  END LOOP;
                  RAISE_APPLICATION_ERROR(-20001, v_invalid || ' invalid object(s)');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ All objects VALID');
              END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Object validity check failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # APEX Import
      # ────────────────────────────────────────────────────────
      - name: "APEX Import"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ] || [ ! -f "$APEX_DIR/install.sql" ]; then
            echo "No APEX export — skipping"
            exit 0
          fi
          echo "::group::APEX Import"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          apex import -dir ${APEX_DIR} -applicationid 100
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::APEX import failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ APEX application imported"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Smoke Tests
      # ────────────────────────────────────────────────────────
      - name: "Smoke Tests"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Smoke Tests"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_pass NUMBER := 0; v_fail NUMBER := 0; v_count NUMBER;
          BEGIN
              SELECT COUNT(*) INTO v_count FROM user_objects
              WHERE object_name = 'PKG_CUSTOMER_LOAD' AND object_type IN ('PACKAGE','PACKAGE BODY') AND status = 'VALID';
              IF v_count = 2 THEN DBMS_OUTPUT.PUT_LINE('✓ PKG_CUSTOMER_LOAD VALID'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ PKG_CUSTOMER_LOAD invalid'); v_fail := v_fail+1; END IF;

              SELECT COUNT(*) INTO v_count FROM TGT_TABLE;
              IF v_count > 0 THEN DBMS_OUTPUT.PUT_LINE('✓ TGT_TABLE has ' || v_count || ' rows'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ TGT_TABLE empty'); v_fail := v_fail+1; END IF;

              DBMS_OUTPUT.PUT_LINE('Results: ' || v_pass || ' passed, ' || v_fail || ' failed');
              IF v_fail > 0 THEN RAISE_APPLICATION_ERROR(-20003, v_fail || ' smoke test(s) failed'); END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Smoke tests failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Data Validation (UAT-specific)
      # ────────────────────────────────────────────────────────
      - name: "Data Validation"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Data Validation"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_pass NUMBER := 0; v_fail NUMBER := 0; v_count NUMBER;
          BEGIN
              SELECT COUNT(*) INTO v_count FROM TGT_TABLE WHERE CUSTOMER_NAME IS NULL;
              IF v_count = 0 THEN DBMS_OUTPUT.PUT_LINE('✓ No NULL customer names'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ ' || v_count || ' NULL customer names'); v_fail := v_fail+1; END IF;

              SELECT COUNT(*) INTO v_count FROM ETL_PROCESS_LOG WHERE STATUS = 'FAILED' AND START_TIME > SYSDATE - 1;
              IF v_count = 0 THEN DBMS_OUTPUT.PUT_LINE('✓ No recent ETL failures'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ ' || v_count || ' recent ETL failures'); v_fail := v_fail+1; END IF;

              SELECT COUNT(*) INTO v_count FROM user_triggers
              WHERE trigger_name = 'TRG_CUSTOMER_AUDIT' AND status = 'ENABLED';
              IF v_count = 1 THEN DBMS_OUTPUT.PUT_LINE('✓ Audit trigger enabled'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ Audit trigger not enabled'); v_fail := v_fail+1; END IF;

              SELECT COUNT(*) INTO v_count FROM user_objects
              WHERE object_type IN ('FUNCTION','PROCEDURE','TRIGGER','PACKAGE','PACKAGE BODY') AND status != 'VALID';
              IF v_count = 0 THEN DBMS_OUTPUT.PUT_LINE('✓ All PL/SQL objects VALID'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ ' || v_count || ' invalid PL/SQL objects'); v_fail := v_fail+1; END IF;

              DBMS_OUTPUT.PUT_LINE('Data Validation: ' || v_pass || ' passed, ' || v_fail || ' failed');
              IF v_fail > 0 THEN RAISE_APPLICATION_ERROR(-20018, v_fail || ' data validation(s) failed'); END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Data validation failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Summary
      # ────────────────────────────────────────────────────────
      - name: "UAT Deployment Summary"
        if: success()
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  ✓ DEPLOYMENT TO UAT SUCCESSFUL"
          echo "════════════════════════════════════════════════════"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo "  Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "════════════════════════════════════════════════════"
