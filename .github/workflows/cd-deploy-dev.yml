# ============================================================
# ASR CI/CD PIPELINE — CD: Deploy to DEV
# ============================================================
# Triggers:
#   1. Push to 'develop' branch (auto-deploy on merge)
#   2. Manual (workflow_dispatch)
# Runs on: Self-hosted runner (EC2)
# Flow: Detect changed SQL scripts → Run via SQLcl → Validate
# ============================================================

name: CD — Deploy to DEV

on:
  push:
    branches:
      - develop
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'

  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DEV Database
    runs-on: self-hosted
    environment: DB-DEV

    steps:
      # ────────────────────────────────────────────────────────
      # Checkout code (with history for git diff)
      # ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # ────────────────────────────────────────────────────────
      # Detect changed SQL scripts
      # ────────────────────────────────────────────────────────
      - name: "Detect Changed Scripts"
        id: changes
        shell: bash
        run: |
          echo "::group::Detecting changed SQL scripts"
          CHANGED=$(git diff --name-only HEAD~1 -- 'scripts/**/*.sql' 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "No SQL scripts changed in this push"
            echo "HAS_SQL_CHANGES=false" >> $GITHUB_ENV
          else
            echo "Changed SQL scripts:"
            echo "$CHANGED"
            echo "$CHANGED" > /tmp/changed_sql.txt
            echo "HAS_SQL_CHANGES=true" >> $GITHUB_ENV
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Run changed SQL scripts (ordered by type)
      # ────────────────────────────────────────────────────────
      - name: "Deploy SQL Scripts"
        if: env.HAS_SQL_CHANGES == 'true'
        id: deploy
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Deploy SQL Scripts via SQLcl"
          ERRORS=0

          # Run scripts in dependency order: ddl → packages → functions → procedures → triggers → views
          for TYPE in ddl packages functions procedures triggers views; do
            SCRIPTS=$(grep "scripts/${TYPE}/" /tmp/changed_sql.txt 2>/dev/null || true)
            if [ -n "$SCRIPTS" ]; then
              echo "── Deploying ${TYPE} ──"
              # DDL scripts: ignore "already exists" errors for idempotent re-runs
              if [ "$TYPE" = "ddl" ]; then
                ORA_EXCLUDE="ORA-17110|ORA-01430|ORA-00955|ORA-01442|ORA-02275|ORA-02261|ORA-01408"
              else
                ORA_EXCLUDE="ORA-17110"
              fi
              while IFS= read -r script; do
                if [ -f "$script" ]; then
                  echo "  Running: $script"
                  OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          SET ECHO ON
          SET SERVEROUTPUT ON
          @${script}
          EXIT
          EOSQL
                  )
                  echo "$OUTPUT"
                  if echo "$OUTPUT" | grep -viE "$ORA_EXCLUDE" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
                    echo "::error file=$script::Deployment failed"
                    ERRORS=$((ERRORS+1))
                  else
                    echo "  ✓ $script deployed"
                  fi
                fi
              done <<< "$SCRIPTS"
            fi
          done

          # Run any other changed SQL scripts (e.g., data fixes)
          OTHER=$(grep -v "scripts/ddl/\|scripts/packages/\|scripts/functions/\|scripts/procedures/\|scripts/triggers/\|scripts/views/\|scripts/loaders/" /tmp/changed_sql.txt 2>/dev/null || true)
          if [ -n "$OTHER" ]; then
            echo "── Deploying other scripts ──"
            while IFS= read -r script; do
              if [ -f "$script" ]; then
                echo "  Running: $script"
                OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          @${script}
          EXIT
          EOSQL
                )
                echo "$OUTPUT"
                if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
                  echo "::error file=$script::Deployment failed"
                  ERRORS=$((ERRORS+1))
                fi
              fi
            done <<< "$OTHER"
          fi

          rm -f /tmp/changed_sql.txt

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS script(s) failed to deploy"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ All changed scripts deployed"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Recompile and validate objects
      # ────────────────────────────────────────────────────────
      - name: "Object Validity Check"
        if: env.HAS_SQL_CHANGES == 'true'
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Object Validity"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_invalid NUMBER;
          BEGIN
              DBMS_UTILITY.COMPILE_SCHEMA(schema => USER, compile_all => FALSE);
              SELECT COUNT(*) INTO v_invalid FROM user_objects WHERE status != 'VALID';
              IF v_invalid > 0 THEN
                  FOR rec IN (SELECT object_type, object_name FROM user_objects WHERE status != 'VALID') LOOP
                      DBMS_OUTPUT.PUT_LINE('  INVALID: ' || rec.object_type || ' — ' || rec.object_name);
                  END LOOP;
                  RAISE_APPLICATION_ERROR(-20001, v_invalid || ' invalid object(s) detected');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ All database objects are VALID');
              END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Object validity check failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Deploy Shell Scripts (make executable)
      # ────────────────────────────────────────────────────────
      - name: "Deploy Shell Scripts"
        shell: bash
        run: |
          echo "::group::Deploy Shell Scripts"
          SCRIPTS=$(find scripts/ -name "*.sh" 2>/dev/null)
          if [ -z "$SCRIPTS" ]; then
            echo "No shell scripts — skipping"
          else
            while IFS= read -r script; do
              chmod +x "$script"
              echo "  ✓ Deployed: $script"
            done <<< "$SCRIPTS"
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # APEX Import
      # ────────────────────────────────────────────────────────
      - name: "APEX Import"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ] || [ ! -f "$APEX_DIR/install.sql" ]; then
            echo "No APEX export found — skipping"
            exit 0
          fi

          echo "::group::APEX Import"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          apex import -dir ${APEX_DIR} -applicationid 100
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::APEX import failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ APEX application imported"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Data Flow: CSV → Staging → Target
      # ────────────────────────────────────────────────────────
      - name: "Data Flow Verification"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Data Flow — CSV → Staging → Target"
          CSV_FILE="data/samples/customers.csv"

          if [ ! -f "$CSV_FILE" ]; then
            echo "No sample CSV found — skipping"
            echo "::endgroup::"
            exit 0
          fi

          {
            echo "SET SERVEROUTPUT ON"
            echo "DELETE FROM STG_TABLE;"
            echo "COMMIT;"
            HEADER=$(head -1 "$CSV_FILE" | xargs)
            tail -n +2 "$CSV_FILE" | while IFS= read -r line; do
              IFS=',' read -ra FIELDS <<< "$line"
              VALUES=""
              for field in "${FIELDS[@]}"; do
                val=$(echo "$field" | xargs | sed "s/'/''/g")
                if [ -z "$VALUES" ]; then
                  VALUES="'${val}'"
                else
                  VALUES="${VALUES}, '${val}'"
                fi
              done
              echo "INSERT INTO STG_TABLE (${HEADER}) VALUES (${VALUES});"
            done
            echo "COMMIT;"
            echo "BEGIN"
            echo "  PKG_CUSTOMER_LOAD.PROCESS_STAGING;"
            echo "  DBMS_OUTPUT.PUT_LINE('Data flow: CSV → Staging → Target complete');"
            echo "END;"
            echo "/"
            echo "SELECT 'STG rows: ' || COUNT(*) AS result FROM STG_TABLE;"
            echo "SELECT 'TGT rows: ' || COUNT(*) AS result FROM TGT_TABLE;"
            echo "EXIT"
          } > /tmp/data_flow.sql

          OUTPUT=$(sql -S "${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION}" @/tmp/data_flow.sql)
          echo "$OUTPUT"
          rm -f /tmp/data_flow.sql

          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Data flow verification failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ Data flow verification complete"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Smoke Tests
      # ────────────────────────────────────────────────────────
      - name: "Smoke Tests"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Smoke Tests"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_pass NUMBER := 0;
              v_fail NUMBER := 0;
              v_count NUMBER;
          BEGIN
              SELECT COUNT(*) INTO v_count FROM user_objects
              WHERE object_name = 'PKG_CUSTOMER_LOAD'
                AND object_type IN ('PACKAGE', 'PACKAGE BODY')
                AND status = 'VALID';
              IF v_count = 2 THEN
                  DBMS_OUTPUT.PUT_LINE('✓ PKG_CUSTOMER_LOAD is VALID');
                  v_pass := v_pass + 1;
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✗ PKG_CUSTOMER_LOAD has invalid components');
                  v_fail := v_fail + 1;
              END IF;

              BEGIN
                  PKG_CUSTOMER_LOAD.PROCESS_STAGING;
                  DBMS_OUTPUT.PUT_LINE('✓ PROCESS_STAGING executed');
                  v_pass := v_pass + 1;
              EXCEPTION
                  WHEN OTHERS THEN
                      DBMS_OUTPUT.PUT_LINE('✗ ' || SQLERRM);
                      v_fail := v_fail + 1;
              END;

              SELECT COUNT(*) INTO v_count FROM TGT_TABLE;
              IF v_count > 0 THEN
                  DBMS_OUTPUT.PUT_LINE('✓ TGT_TABLE has ' || v_count || ' rows');
                  v_pass := v_pass + 1;
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✗ TGT_TABLE is empty');
                  v_fail := v_fail + 1;
              END IF;

              DBMS_OUTPUT.PUT_LINE('Results: ' || v_pass || ' passed, ' || v_fail || ' failed');
              IF v_fail > 0 THEN
                  RAISE_APPLICATION_ERROR(-20003, v_fail || ' smoke test(s) failed');
              END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "^ERROR|ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Smoke tests failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ All smoke tests passed"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Summary
      # ────────────────────────────────────────────────────────
      - name: "Deployment Summary"
        if: success()
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  ✓ DEPLOYMENT TO DEV SUCCESSFUL"
          echo "════════════════════════════════════════════════════"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo "  Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "════════════════════════════════════════════════════"
