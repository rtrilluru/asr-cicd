# ============================================================
# ASR CI/CD PIPELINE — CD: Deploy to DEV
# ============================================================
# Triggers: On push to 'develop' branch (after PR merge)
# Runs on: Self-hosted runner (your laptop)
# Gates: G9 (Dry-Run), G10 (Deploy), G11 (Object Validity),
#         G14 (Smoke Tests), G27 (APEX Import Validation)
# ============================================================

name: CD — Deploy to DEV

on:
  push:
    branches:
      - develop
    paths:
      - 'migrations/**'
      - 'rollbacks/**'
      - 'packages/**'
      - 'schema/**'
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'

# Prevent concurrent deployments to same environment
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DEV Database
    runs-on: self-hosted
    environment: DB-DEV

    steps:
      # ────────────────────────────────────────────────────────
      # Checkout code
      # ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────
      # Pre-Deploy: Tag current state (rollback point)
      # ────────────────────────────────────────────────────────
      - name: "Pre-Deploy: Tag database state"
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Tagging current database state"
          TAG_NAME="pre-deploy-$(date +%Y%m%d-%H%M%S)"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Creating tag: $TAG_NAME"

          cd migrations
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<EOSQL
          liquibase tag -tag $TAG_NAME
          EXIT
          EOSQL

          echo "✓ Database tagged as: $TAG_NAME"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G9: Dry-Run Migration (preview SQL)
      # ────────────────────────────────────────────────────────
      - name: "Gate G9: Dry-Run Migration (updateSQL)"
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G9 — Dry-Run (SQL Preview)"
          cd migrations
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET ECHO OFF
          liquibase update-sql -changelog-file db.changelog-master.xml
          EXIT
          EOSQL

          if [ $? -ne 0 ]; then
            echo "::error::G9 FAILED: Dry-run generated errors"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ Dry-run successful — SQL preview generated"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G10: Execute Migration
      # ────────────────────────────────────────────────────────
      - name: "Gate G10: Execute Migration"
        id: deploy
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G10 — Execute Migration"
          cd migrations
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          liquibase update -changelog-file db.changelog-master.xml
          EXIT
          EOSQL

          if [ $? -ne 0 ]; then
            echo "DEPLOY_STATUS=failed" >> $GITHUB_ENV
            echo "::error::G10 FAILED: Migration execution error"
            echo "::endgroup::"
            exit 1
          fi
          echo "DEPLOY_STATUS=success" >> $GITHUB_ENV
          echo "✓ Migration executed successfully"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Auto-Rollback on Deploy Failure
      # ────────────────────────────────────────────────────────
      - name: "Auto-Rollback (on deploy failure)"
        if: failure() && steps.deploy.outcome == 'failure'
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::warning::DEPLOYMENT FAILED — Executing auto-rollback to tag: $TAG_NAME"
          cd migrations
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<EOSQL
          liquibase rollback -tag $TAG_NAME -changelog-file db.changelog-master.xml
          EXIT
          EOSQL
          echo "✓ Rollback complete — database restored to pre-deployment state"

      # ────────────────────────────────────────────────────────
      # G11: Post-Deploy Object Validation
      # ────────────────────────────────────────────────────────
      - name: "Gate G11: Object Validity Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G11 — Object Validity"
          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          SET PAGESIZE 0
          DECLARE
              v_invalid NUMBER;
          BEGIN
              SELECT COUNT(*) INTO v_invalid
              FROM user_objects WHERE status != 'VALID';

              IF v_invalid > 0 THEN
                  DBMS_OUTPUT.PUT_LINE('INVALID_OBJECTS=' || v_invalid);
                  FOR rec IN (SELECT object_type, object_name FROM user_objects WHERE status != 'VALID') LOOP
                      DBMS_OUTPUT.PUT_LINE('  INVALID: ' || rec.object_type || ' — ' || rec.object_name);
                  END LOOP;
                  RAISE_APPLICATION_ERROR(-20001, v_invalid || ' invalid object(s) detected');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('ALL_VALID=true');
                  DBMS_OUTPUT.PUT_LINE('All database objects are in VALID state');
              END IF;
          END;
          /
          EXIT
          EOSQL

          if [ $? -ne 0 ]; then
            echo "::error::G11 FAILED: Invalid objects detected after deployment"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ All objects VALID"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # APEX Import (if APEX files present)
      # ────────────────────────────────────────────────────────
      - name: "APEX Import"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ] || [ ! -f "$APEX_DIR/install.sql" ]; then
            echo "No APEX export found — skipping APEX deployment"
            exit 0
          fi

          echo "::group::APEX Import"
          echo "Importing APEX application from: $APEX_DIR"

          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          apex import -dir ${APEX_DIR} -applicationid 100
          EXIT
          EOSQL

          if [ $? -ne 0 ]; then
            echo "::warning::APEX import encountered issues — check logs"
          else
            echo "✓ APEX application imported successfully"
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G27: APEX Import Validation
      # ────────────────────────────────────────────────────────
      - name: "Gate G27: APEX Import Validation"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ]; then
            echo "No APEX application — skipping validation"
            exit 0
          fi

          echo "::group::G27 — APEX Import Validation"
          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_count NUMBER;
          BEGIN
              SELECT COUNT(*) INTO v_count
              FROM apex_applications
              WHERE application_id = 100;

              IF v_count = 1 THEN
                  DBMS_OUTPUT.PUT_LINE('✓ APEX App 100 exists and is accessible');
              ELSE
                  RAISE_APPLICATION_ERROR(-20002, 'APEX App 100 not found after import');
              END IF;
          END;
          /
          EXIT
          EOSQL

          if [ $? -ne 0 ]; then
            echo "::warning::G27: APEX validation issue detected"
          else
            echo "✓ APEX application validated"
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G14: Smoke Tests
      # ────────────────────────────────────────────────────────
      - name: "Gate G14: Smoke Tests"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G14 — Smoke Tests"
          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_pass NUMBER := 0;
              v_fail NUMBER := 0;
              v_count NUMBER;
          BEGIN
              -- Test 1: Package is VALID
              SELECT COUNT(*) INTO v_count
              FROM user_objects
              WHERE object_name = 'PKG_CUSTOMER_LOAD'
                AND object_type IN ('PACKAGE', 'PACKAGE BODY')
                AND status = 'VALID';
              IF v_count = 2 THEN
                  DBMS_OUTPUT.PUT_LINE('✓ Test 1: PKG_CUSTOMER_LOAD is VALID');
                  v_pass := v_pass + 1;
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✗ Test 1: PKG_CUSTOMER_LOAD has invalid components');
                  v_fail := v_fail + 1;
              END IF;

              -- Test 2: Package is callable
              BEGIN
                  PKG_CUSTOMER_LOAD.PROCESS_STAGING;
                  DBMS_OUTPUT.PUT_LINE('✓ Test 2: Package executed successfully');
                  v_pass := v_pass + 1;
              EXCEPTION
                  WHEN OTHERS THEN
                      DBMS_OUTPUT.PUT_LINE('✗ Test 2: ' || SQLERRM);
                      v_fail := v_fail + 1;
              END;

              -- Test 3: Target table has data
              SELECT COUNT(*) INTO v_count FROM TGT_CUSTOMER;
              IF v_count > 0 THEN
                  DBMS_OUTPUT.PUT_LINE('✓ Test 3: TGT_CUSTOMER has ' || v_count || ' rows');
                  v_pass := v_pass + 1;
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✗ Test 3: TGT_CUSTOMER is empty');
                  v_fail := v_fail + 1;
              END IF;

              -- Summary
              DBMS_OUTPUT.PUT_LINE('');
              DBMS_OUTPUT.PUT_LINE('Results: ' || v_pass || ' passed, ' || v_fail || ' failed');

              IF v_fail > 0 THEN
                  RAISE_APPLICATION_ERROR(-20003, v_fail || ' smoke test(s) failed');
              END IF;
          END;
          /
          EXIT
          EOSQL

          if [ $? -ne 0 ]; then
            echo "::error::G14 FAILED: Smoke tests detected issues"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ All smoke tests passed"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Deploy Shell Scripts
      # ────────────────────────────────────────────────────────
      - name: "Deploy Shell Scripts"
        shell: bash
        run: |
          echo "::group::Deploy Shell Scripts"
          SCRIPTS_SRC="scripts"

          if [ ! -d "$SCRIPTS_SRC" ]; then
            echo "No scripts directory — skipping"
            echo "::endgroup::"
            exit 0
          fi

          SCRIPT_COUNT=$(find "$SCRIPTS_SRC" -name "*.sh" 2>/dev/null | wc -l)
          if [ "$SCRIPT_COUNT" -eq 0 ]; then
            echo "No .sh files found — skipping"
            echo "::endgroup::"
            exit 0
          fi

          echo "Deploying $SCRIPT_COUNT shell script(s)..."
          find "$SCRIPTS_SRC" -name "*.sh" | while read -r script; do
            chmod +x "$script"
            echo "  ✓ Deployed: $script"
          done

          echo "✓ All shell scripts deployed"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Data Flow Verification: CSV → Staging → Target
      # ────────────────────────────────────────────────────────
      - name: "Data Flow Verification"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Data Flow — CSV → Staging → Target"
          CSV_FILE="data/samples/customers.csv"

          if [ ! -f "$CSV_FILE" ]; then
            echo "No sample CSV found — skipping data flow test"
            echo "::endgroup::"
            exit 0
          fi

          echo "Loading CSV into STG_CUSTOMER and processing..."

          {
            echo "SET SERVEROUTPUT ON"
            tail -n +2 "$CSV_FILE" | while IFS=',' read -r sys name email phone; do
              sys=$(echo "$sys" | xargs)
              name=$(echo "$name" | xargs)
              email=$(echo "$email" | xargs)
              phone=$(echo "$phone" | xargs)
              echo "INSERT INTO STG_CUSTOMER (SOURCE_SYSTEM, CUSTOMER_NAME, CUSTOMER_EMAIL, CUSTOMER_PHONE) VALUES ('${sys}', '${name}', '${email}', '${phone}');"
            done
            echo "COMMIT;"
            echo "BEGIN"
            echo "  PKG_CUSTOMER_LOAD.PROCESS_STAGING;"
            echo "  DBMS_OUTPUT.PUT_LINE('✓ Data flow: CSV → Staging → Target complete');"
            echo "END;"
            echo "/"
            echo "SELECT 'STG rows: ' || COUNT(*) AS result FROM STG_CUSTOMER;"
            echo "SELECT 'TGT rows: ' || COUNT(*) AS result FROM TGT_CUSTOMER;"
            echo "EXIT"
          } | sql -S "${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION}"

          echo "✓ Data flow verification complete"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Deployment Audit Record
      # ────────────────────────────────────────────────────────
      - name: "Record Deployment Audit"
        if: always()
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Deployment Audit"
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET LINESIZE 200
          SET PAGESIZE 20
          COLUMN ID FORMAT A40
          COLUMN AUTHOR FORMAT A12
          COLUMN DATEEXECUTED FORMAT A20

          SELECT ID, AUTHOR, TO_CHAR(DATEEXECUTED,'YYYY-MM-DD HH24:MI:SS') AS DATEEXECUTED,
                 ORDEREXECUTED, TAG
          FROM DATABASECHANGELOG
          ORDER BY ORDEREXECUTED DESC
          FETCH FIRST 10 ROWS ONLY;
          EXIT
          EOSQL
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Summary
      # ────────────────────────────────────────────────────────
      - name: "Deployment Summary"
        if: success()
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  ✓ DEPLOYMENT TO DEV SUCCESSFUL"
          echo "════════════════════════════════════════════════════"
          echo "  Tag: $TAG_NAME"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo "  Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "════════════════════════════════════════════════════"
