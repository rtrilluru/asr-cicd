# ============================================================
# ASR CI/CD PIPELINE — CI: Validation
# ============================================================
# Triggers:
#   1. Push to feature/*, bugfix/*, hotfix/* branches
#   2. Pull Request to develop
#   3. Manual (workflow_dispatch)
# Runs on: Self-hosted runner (EC2)
# Validates: SQL syntax, naming, security, shell scripts, APEX
# ============================================================

name: CI — Validation

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'
      - '.github/workflows/**'

  pull_request:
    branches:
      - develop
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'
      - '.github/workflows/**'

  workflow_dispatch:

jobs:
  validate:
    name: Validate Scripts
    runs-on: self-hosted

    steps:
      # ────────────────────────────────────────────────────────
      # Checkout code
      # ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────
      # G1: SQL Script Naming Convention
      # ────────────────────────────────────────────────────────
      - name: "Gate G1: SQL Script Naming"
        shell: bash
        run: |
          echo "::group::G1 — SQL Script Naming"
          ERRORS=0
          SQL_FILES=$(find scripts/ -name "*.sql" 2>/dev/null)
          if [ -z "$SQL_FILES" ]; then
            echo "No SQL scripts found — skipping"
          else
            while IFS= read -r f; do
              BASENAME=$(basename "$f")
              if [[ ! "$BASENAME" =~ ^[a-z][a-z0-9_]*\.sql$ ]]; then
                echo "::error file=$f::Naming violation: use lowercase with underscores (e.g., pkg_customer_load.sql)"
                ERRORS=$((ERRORS+1))
              else
                echo "  ✓ $f"
              fi
            done <<< "$SQL_FILES"
          fi
          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then
            echo "::error::G1 FAILED: $ERRORS file(s) with naming violations"
            exit 1
          fi

      # ────────────────────────────────────────────────────────
      # G2: Shell Script Validation
      # ────────────────────────────────────────────────────────
      - name: "Gate G2: Shell Script Validation"
        shell: bash
        run: |
          echo "::group::G2 — Shell Script Validation"
          ERRORS=0
          SCRIPTS=$(find scripts/ -name "*.sh" 2>/dev/null)
          if [ -z "$SCRIPTS" ]; then
            echo "No shell scripts found — skipping"
          else
            while IFS= read -r f; do
              echo "Checking: $f"
              FIRST_LINE=$(head -1 "$f")
              if [[ "$FIRST_LINE" != "#!/bin/bash"* && "$FIRST_LINE" != "#!/bin/sh"* ]]; then
                echo "::error file=$f::Missing shebang (#!/bin/bash) on first line"
                ERRORS=$((ERRORS+1))
              else
                echo "  ✓ Shebang present"
              fi

              if grep -qiE "(password|secret|token)\s*=\s*['\"][^'\"]+['\"]" "$f"; then
                echo "::error file=$f::Hardcoded credentials detected"
                ERRORS=$((ERRORS+1))
              else
                echo "  ✓ No hardcoded credentials"
              fi

              BASENAME=$(basename "$f")
              if [[ ! "$BASENAME" =~ ^[a-z][a-z0-9_]*\.sh$ ]]; then
                echo "::error file=$f::Naming violation: use lowercase with underscores"
                ERRORS=$((ERRORS+1))
              else
                echo "  ✓ Naming convention OK"
              fi
            done <<< "$SCRIPTS"
          fi
          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then
            echo "::error::G2 FAILED: $ERRORS shell script issue(s)"
            exit 1
          fi

      # ────────────────────────────────────────────────────────
      # G5: Security Scan (credentials in code)
      # ────────────────────────────────────────────────────────
      - name: "Gate G5: Security Scan"
        shell: bash
        run: |
          echo "::group::G5 — Security Scanning"
          SECRETS=$(grep -riE "(password|secret|api_key|token)\s*[:=]\s*['\"][^'\"]+['\"]" \
            scripts/ data/ \
            --include="*.sql" --include="*.sh" --include="*.csv" -l 2>/dev/null || true)
          if [ -z "$SECRETS" ]; then
            echo "✓ No hardcoded credentials detected"
          else
            echo "::error::Potential credentials found in:"
            echo "$SECRETS"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G6: SQL Syntax Validation (SQLcl parse)
      # ────────────────────────────────────────────────────────
      - name: "Gate G6: SQL Syntax Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G6 — SQL Syntax Validation"
          ERRORS=0
          SQL_FILES=$(find scripts/ -name "*.sql" 2>/dev/null)
          if [ -z "$SQL_FILES" ]; then
            echo "No SQL scripts found — skipping"
            echo "::endgroup::"
            exit 0
          fi

          while IFS= read -r f; do
            echo "Validating: $f"
            OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          SET ECHO OFF
          SET FEEDBACK OFF
          @$f
          EXIT
          EOSQL
            )
            # DDL scripts: ignore "already exists" errors
            if [[ "$f" == scripts/ddl/* ]]; then
              ORA_EXCLUDE="ORA-17110|ORA-01430|ORA-00955|ORA-01442|ORA-02275|ORA-02261|ORA-01408"
            else
              ORA_EXCLUDE="ORA-17110"
            fi
            if echo "$OUTPUT" | grep -viE "$ORA_EXCLUDE" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
              echo "::error file=$f::SQL errors detected"
              echo "$OUTPUT"
              ERRORS=$((ERRORS+1))
            else
              echo "  ✓ $f — valid"
            fi
          done <<< "$SQL_FILES"
          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then
            echo "::error::G6 FAILED: $ERRORS script(s) with syntax errors"
            exit 1
          fi

      # ────────────────────────────────────────────────────────
      # G26: APEX Export Integrity
      # ────────────────────────────────────────────────────────
      - name: "Gate G26: APEX Export Integrity"
        shell: bash
        run: |
          echo "::group::G26 — APEX Export Integrity"
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ]; then
            echo "No APEX export found — skipping"
            echo "::endgroup::"
            exit 0
          fi

          ERRORS=0

          if [ -f "$APEX_DIR/install.sql" ]; then
            echo "✓ install.sql exists"
          else
            echo "::error::install.sql missing in $APEX_DIR"
            ERRORS=$((ERRORS+1))
          fi

          ENV_URLS=$(grep -riE "https?://(dev|sit|uat|prod)" "$APEX_DIR" -l 2>/dev/null || true)
          if [ -z "$ENV_URLS" ]; then
            echo "✓ No hardcoded environment URLs"
          else
            echo "::error::Environment-specific URLs found in: $ENV_URLS"
            ERRORS=$((ERRORS+1))
          fi

          echo "::endgroup::"
          if [ $ERRORS -gt 0 ]; then
            exit 1
          fi

      # ────────────────────────────────────────────────────────
      # Summary
      # ────────────────────────────────────────────────────────
      - name: "CI Validation Summary"
        if: always()
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  CI VALIDATION COMPLETE"
          echo "════════════════════════════════════════════════════"
          echo "  Gates executed: G1, G2, G5, G6, G26"
          echo "  Result: Check step statuses above"
          echo "════════════════════════════════════════════════════"
