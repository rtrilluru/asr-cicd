# ============================================================
# ASR CI/CD PIPELINE — CD: Deploy to SIT
# ============================================================
# Triggers:
#   1. Push to 'sit' branch (auto-deploy on merge from develop)
#   2. Manual (workflow_dispatch)
# Runs on: Self-hosted runner (EC2)
# Flow: Run ALL SQL scripts via SQLcl → Validate → Smoke Test
# ============================================================

name: CD — Deploy to SIT

on:
  push:
    branches:
      - sit
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'

  workflow_dispatch:

concurrency:
  group: deploy-sit
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to SIT Database
    runs-on: self-hosted
    environment: DB-SIT

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────
      # Deploy ALL SQL scripts (full sync to SIT)
      # ────────────────────────────────────────────────────────
      - name: "Deploy SQL Scripts"
        id: deploy
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Deploy ALL SQL Scripts to SIT"
          ERRORS=0

          for TYPE in ddl packages functions procedures triggers views; do
            SCRIPTS=$(find scripts/${TYPE}/ -name "*.sql" 2>/dev/null | sort)
            if [ -n "$SCRIPTS" ]; then
              echo "── Deploying ${TYPE} ──"
              # DDL scripts: ignore "already exists" errors for idempotent re-runs
              if [ "$TYPE" = "ddl" ]; then
                ORA_EXCLUDE="ORA-17110|ORA-01430|ORA-00955|ORA-01442|ORA-02275|ORA-02261|ORA-01408"
              else
                ORA_EXCLUDE="ORA-17110"
              fi
              while IFS= read -r script; do
                echo "  Running: $script"
                OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          SET ECHO ON
          SET SERVEROUTPUT ON
          @${script}
          EXIT
          EOSQL
                )
                echo "$OUTPUT"
                if echo "$OUTPUT" | grep -viE "$ORA_EXCLUDE" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
                  echo "::error file=$script::Deployment failed"
                  ERRORS=$((ERRORS+1))
                else
                  echo "  ✓ $script deployed"
                fi
              done <<< "$SCRIPTS"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS script(s) failed to deploy"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ All scripts deployed to SIT"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Object Validity
      # ────────────────────────────────────────────────────────
      - name: "Object Validity Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Object Validity"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_invalid NUMBER;
          BEGIN
              DBMS_UTILITY.COMPILE_SCHEMA(schema => USER, compile_all => FALSE);
              SELECT COUNT(*) INTO v_invalid FROM user_objects WHERE status != 'VALID';
              IF v_invalid > 0 THEN
                  FOR rec IN (SELECT object_type, object_name FROM user_objects WHERE status != 'VALID') LOOP
                      DBMS_OUTPUT.PUT_LINE('  INVALID: ' || rec.object_type || ' — ' || rec.object_name);
                  END LOOP;
                  RAISE_APPLICATION_ERROR(-20001, v_invalid || ' invalid object(s) detected');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ All objects VALID');
              END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Object validity check failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Deploy Shell Scripts
      # ────────────────────────────────────────────────────────
      - name: "Deploy Shell Scripts"
        shell: bash
        run: |
          echo "::group::Deploy Shell Scripts"
          find scripts/ -name "*.sh" 2>/dev/null | while read -r script; do
            chmod +x "$script"
            echo "  ✓ Deployed: $script"
          done
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # APEX Import
      # ────────────────────────────────────────────────────────
      - name: "APEX Import"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ] || [ ! -f "$APEX_DIR/install.sql" ]; then
            echo "No APEX export found — skipping"
            exit 0
          fi
          echo "::group::APEX Import"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          apex import -dir ${APEX_DIR} -applicationid 100
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::APEX import failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ APEX application imported"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Data Flow: CSV → Staging → Target
      # ────────────────────────────────────────────────────────
      - name: "Data Flow Verification"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Data Flow — CSV → Staging → Target"
          CSV_FILE="data/samples/customers.csv"

          if [ ! -f "$CSV_FILE" ]; then
            echo "No sample CSV found — skipping"
            echo "::endgroup::"
            exit 0
          fi

          {
            echo "SET SERVEROUTPUT ON"
            echo "DELETE FROM STG_TABLE;"
            echo "COMMIT;"
            HEADER=$(head -1 "$CSV_FILE" | xargs)
            tail -n +2 "$CSV_FILE" | while IFS= read -r line; do
              IFS=',' read -ra FIELDS <<< "$line"
              VALUES=""
              for field in "${FIELDS[@]}"; do
                val=$(echo "$field" | xargs | sed "s/'/''/g")
                if [ -z "$VALUES" ]; then
                  VALUES="'${val}'"
                else
                  VALUES="${VALUES}, '${val}'"
                fi
              done
              echo "INSERT INTO STG_TABLE (${HEADER}) VALUES (${VALUES});"
            done
            echo "COMMIT;"
            echo "BEGIN"
            echo "  PKG_CUSTOMER_LOAD.PROCESS_STAGING;"
            echo "  DBMS_OUTPUT.PUT_LINE('Data flow: CSV → Staging → Target complete');"
            echo "END;"
            echo "/"
            echo "SELECT 'STG rows: ' || COUNT(*) AS result FROM STG_TABLE;"
            echo "SELECT 'TGT rows: ' || COUNT(*) AS result FROM TGT_TABLE;"
            echo "EXIT"
          } > /tmp/data_flow.sql

          OUTPUT=$(sql -S "${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION}" @/tmp/data_flow.sql)
          echo "$OUTPUT"
          rm -f /tmp/data_flow.sql

          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Data flow verification failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ Data flow verification complete"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Smoke Tests
      # ────────────────────────────────────────────────────────
      - name: "Smoke Tests"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Smoke Tests"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_pass NUMBER := 0; v_fail NUMBER := 0; v_count NUMBER;
          BEGIN
              SELECT COUNT(*) INTO v_count FROM user_objects
              WHERE object_name = 'PKG_CUSTOMER_LOAD' AND object_type IN ('PACKAGE','PACKAGE BODY') AND status = 'VALID';
              IF v_count = 2 THEN DBMS_OUTPUT.PUT_LINE('✓ PKG_CUSTOMER_LOAD VALID'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ PKG_CUSTOMER_LOAD invalid'); v_fail := v_fail+1; END IF;

              BEGIN PKG_CUSTOMER_LOAD.PROCESS_STAGING; DBMS_OUTPUT.PUT_LINE('✓ PROCESS_STAGING executed'); v_pass := v_pass+1;
              EXCEPTION WHEN OTHERS THEN DBMS_OUTPUT.PUT_LINE('✗ ' || SQLERRM); v_fail := v_fail+1; END;

              SELECT COUNT(*) INTO v_count FROM TGT_TABLE;
              IF v_count > 0 THEN DBMS_OUTPUT.PUT_LINE('✓ TGT_TABLE has ' || v_count || ' rows'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ TGT_TABLE empty'); v_fail := v_fail+1; END IF;

              DBMS_OUTPUT.PUT_LINE('Results: ' || v_pass || ' passed, ' || v_fail || ' failed');
              IF v_fail > 0 THEN RAISE_APPLICATION_ERROR(-20003, v_fail || ' smoke test(s) failed'); END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Smoke tests failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Integration Tests (SIT-specific)
      # ────────────────────────────────────────────────────────
      - name: "Integration Tests"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Integration Tests"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_pass NUMBER := 0; v_fail NUMBER := 0;
              v_result VARCHAR2(20); v_count NUMBER; v_deleted NUMBER;
          BEGIN
              BEGIN
                  SELECT FN_CUSTOMER_STATUS(1) INTO v_result FROM dual;
                  IF v_result IN ('COMPLETE','PARTIAL','INCOMPLETE','NOT_FOUND') THEN
                      DBMS_OUTPUT.PUT_LINE('✓ FN_CUSTOMER_STATUS returned: ' || v_result); v_pass := v_pass+1;
                  ELSE
                      DBMS_OUTPUT.PUT_LINE('✗ Unexpected result: ' || v_result); v_fail := v_fail+1;
                  END IF;
              EXCEPTION WHEN OTHERS THEN
                  DBMS_OUTPUT.PUT_LINE('✗ FN_CUSTOMER_STATUS error: ' || SQLERRM); v_fail := v_fail+1;
              END;

              BEGIN
                  SP_REFRESH_STAGING(p_days_old => 9999, p_records_deleted => v_deleted);
                  DBMS_OUTPUT.PUT_LINE('✓ SP_REFRESH_STAGING ran, deleted: ' || v_deleted); v_pass := v_pass+1;
              EXCEPTION WHEN OTHERS THEN
                  DBMS_OUTPUT.PUT_LINE('✗ SP_REFRESH_STAGING error: ' || SQLERRM); v_fail := v_fail+1;
              END;

              BEGIN
                  INSERT INTO TGT_TABLE (CUSTOMER_NAME, CUSTOMER_EMAIL, SOURCE_SYSTEM, CREATED_DATE)
                  VALUES ('Integration Test', 'test@sit.com', 'SIT_TEST', SYSDATE);
                  SELECT COUNT(*) INTO v_count FROM TGT_TABLE_AUDIT WHERE NEW_NAME = 'Integration Test';
                  IF v_count > 0 THEN
                      DBMS_OUTPUT.PUT_LINE('✓ TRG_CUSTOMER_AUDIT fired on INSERT'); v_pass := v_pass+1;
                  ELSE
                      DBMS_OUTPUT.PUT_LINE('✗ Audit trigger did not fire'); v_fail := v_fail+1;
                  END IF;
                  ROLLBACK;
              EXCEPTION WHEN OTHERS THEN
                  DBMS_OUTPUT.PUT_LINE('✗ Audit trigger test error: ' || SQLERRM); v_fail := v_fail+1; ROLLBACK;
              END;

              DBMS_OUTPUT.PUT_LINE('Integration Results: ' || v_pass || ' passed, ' || v_fail || ' failed');
              IF v_fail > 0 THEN RAISE_APPLICATION_ERROR(-20015, v_fail || ' integration test(s) failed'); END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Integration tests failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Summary
      # ────────────────────────────────────────────────────────
      - name: "SIT Deployment Summary"
        if: success()
        shell: bash
        run: |
          echo ""
          echo "════════════════════════════════════════════════════"
          echo "  ✓ DEPLOYMENT TO SIT SUCCESSFUL"
          echo "════════════════════════════════════════════════════"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Actor: ${{ github.actor }}"
          echo "  Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "════════════════════════════════════════════════════"
