# ============================================================
# ASR CI/CD PIPELINE — CD: Deploy to PROD
# ============================================================
# Triggers:
#   1. Push to 'master' branch (auto-deploy on merge from uat)
#   2. Manual (workflow_dispatch)
# Runs on: Self-hosted runner (EC2)
# Flow: Health Check → Deploy ALL scripts → Validate → Smoke
# ============================================================

name: CD — Deploy to PROD

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'

  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to PROD Database
    runs-on: self-hosted
    environment: DB-PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────
      # Deployment Window Check
      # ────────────────────────────────────────────────────────
      - name: "Deployment Window Check"
        shell: bash
        run: |
          echo "::group::Deployment Window"
          HOUR=$(date +%H)
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 22 ]; then
            echo "✓ Within deployment window (06:00-22:00 UTC)"
          else
            echo "::error::Outside deployment window (current: ${HOUR}:00 UTC)"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Pre-Deploy Health Check
      # ────────────────────────────────────────────────────────
      - name: "Pre-Deploy Health Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Pre-Deploy Health Check"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_count NUMBER;
          BEGIN
              SELECT 'OK' FROM dual;
              DBMS_OUTPUT.PUT_LINE('✓ Database responsive');
              SELECT COUNT(*) INTO v_count FROM user_objects WHERE status != 'VALID';
              IF v_count > 0 THEN
                  DBMS_OUTPUT.PUT_LINE('WARNING: ' || v_count || ' invalid objects before deployment');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ All objects VALID before deployment');
              END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Database not healthy"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Deploy ALL SQL scripts (full sync to PROD)
      # ────────────────────────────────────────────────────────
      - name: "Deploy SQL Scripts"
        id: deploy
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Deploy ALL SQL Scripts to PROD"
          ERRORS=0

          for TYPE in ddl packages functions procedures triggers views; do
            SCRIPTS=$(find scripts/${TYPE}/ -name "*.sql" 2>/dev/null | sort)
            if [ -n "$SCRIPTS" ]; then
              echo "── Deploying ${TYPE} ──"
              # DDL scripts: ignore "already exists" errors for idempotent re-runs
              if [ "$TYPE" = "ddl" ]; then
                ORA_EXCLUDE="ORA-17110|ORA-01430|ORA-00955|ORA-01442|ORA-02275|ORA-02261|ORA-01408"
              else
                ORA_EXCLUDE="ORA-17110"
              fi
              while IFS= read -r script; do
                echo "  Running: $script"
                OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          SET ECHO ON
          SET SERVEROUTPUT ON
          @${script}
          EXIT
          EOSQL
                )
                echo "$OUTPUT"
                if echo "$OUTPUT" | grep -viE "$ORA_EXCLUDE" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
                  echo "::error file=$script::Deployment failed"
                  ERRORS=$((ERRORS+1))
                else
                  echo "  ✓ $script deployed"
                fi
              done <<< "$SCRIPTS"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS script(s) failed to deploy"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ All scripts deployed to PROD"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Object Validity
      # ────────────────────────────────────────────────────────
      - name: "Object Validity Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Object Validity"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_invalid NUMBER;
          BEGIN
              DBMS_UTILITY.COMPILE_SCHEMA(schema => USER, compile_all => FALSE);
              SELECT COUNT(*) INTO v_invalid FROM user_objects WHERE status != 'VALID';
              IF v_invalid > 0 THEN
                  FOR rec IN (SELECT object_type, object_name FROM user_objects WHERE status != 'VALID') LOOP
                      DBMS_OUTPUT.PUT_LINE('  INVALID: ' || rec.object_type || ' — ' || rec.object_name);
                  END LOOP;
                  RAISE_APPLICATION_ERROR(-20001, v_invalid || ' invalid object(s)');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ All objects VALID');
              END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Object validity check failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Deploy Shell Scripts
      # ────────────────────────────────────────────────────────
      - name: "Deploy Shell Scripts"
        shell: bash
        run: |
          echo "::group::Deploy Shell Scripts"
          find scripts/ -name "*.sh" 2>/dev/null | while read -r script; do
            chmod +x "$script"
            echo "  ✓ Deployed: $script"
          done
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # APEX Import
      # ────────────────────────────────────────────────────────
      - name: "APEX Import"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ] || [ ! -f "$APEX_DIR/install.sql" ]; then
            echo "No APEX export — skipping"
            exit 0
          fi
          echo "::group::APEX Import"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          apex import -dir ${APEX_DIR} -applicationid 100
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::APEX import failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "✓ APEX application imported"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Production Smoke Tests
      # ────────────────────────────────────────────────────────
      - name: "Production Smoke Tests"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Production Smoke Tests"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_pass NUMBER := 0; v_fail NUMBER := 0; v_count NUMBER; v_result VARCHAR2(20);
          BEGIN
              SELECT COUNT(*) INTO v_count FROM user_objects
              WHERE object_type IN ('PACKAGE','PACKAGE BODY','FUNCTION','PROCEDURE','TRIGGER') AND status != 'VALID';
              IF v_count = 0 THEN DBMS_OUTPUT.PUT_LINE('✓ All PL/SQL objects VALID'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ ' || v_count || ' invalid PL/SQL objects'); v_fail := v_fail+1; END IF;

              BEGIN PKG_CUSTOMER_LOAD.PROCESS_STAGING; DBMS_OUTPUT.PUT_LINE('✓ PROCESS_STAGING executed'); v_pass := v_pass+1;
              EXCEPTION WHEN OTHERS THEN DBMS_OUTPUT.PUT_LINE('✗ ' || SQLERRM); v_fail := v_fail+1; END;

              BEGIN
                  SELECT FN_CUSTOMER_STATUS(1) INTO v_result FROM dual;
                  DBMS_OUTPUT.PUT_LINE('✓ FN_CUSTOMER_STATUS: ' || v_result); v_pass := v_pass+1;
              EXCEPTION WHEN OTHERS THEN DBMS_OUTPUT.PUT_LINE('✗ ' || SQLERRM); v_fail := v_fail+1; END;

              SELECT COUNT(*) INTO v_count FROM TGT_TABLE;
              IF v_count > 0 THEN DBMS_OUTPUT.PUT_LINE('✓ TGT_TABLE: ' || v_count || ' rows'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ TGT_TABLE empty'); v_fail := v_fail+1; END IF;

              SELECT COUNT(*) INTO v_count FROM user_triggers
              WHERE trigger_name = 'TRG_CUSTOMER_AUDIT' AND status = 'ENABLED';
              IF v_count = 1 THEN DBMS_OUTPUT.PUT_LINE('✓ Audit trigger enabled'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ Audit trigger not enabled'); v_fail := v_fail+1; END IF;

              DBMS_OUTPUT.PUT_LINE('Production Smoke: ' || v_pass || ' passed, ' || v_fail || ' failed');
              IF v_fail > 0 THEN RAISE_APPLICATION_ERROR(-20024, v_fail || ' production smoke test(s) failed'); END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Production smoke tests failed"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Performance Check
      # ────────────────────────────────────────────────────────
      - name: "Performance Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Performance Check"
          OUTPUT=$(sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_start TIMESTAMP;
              v_elapsed NUMBER;
          BEGIN
              v_start := SYSTIMESTAMP;
              PKG_CUSTOMER_LOAD.PROCESS_STAGING;
              v_elapsed := EXTRACT(SECOND FROM (SYSTIMESTAMP - v_start));
              DBMS_OUTPUT.PUT_LINE('PROCESS_STAGING elapsed: ' || ROUND(v_elapsed, 3) || ' seconds');
              IF v_elapsed > 5 THEN
                  DBMS_OUTPUT.PUT_LINE('WARNING: Execution exceeded 5s threshold');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ Performance within acceptable range');
              END IF;
          END;
          /
          EXIT
          EOSQL
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -viE "ORA-17110" | grep -qiE "ORA-|SP2-|SEVERE|\.exception\."; then
            echo "::error::Performance check error"
            echo "::endgroup::"
            exit 1
          fi
          if echo "$OUTPUT" | grep -qi "WARNING.*exceeded.*5s"; then
            echo "::error::Performance threshold exceeded"
            echo "::endgroup::"
            exit 1
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Summary
      # ────────────────────────────────────────────────────────
      - name: "PROD Deployment Summary"
        if: success()
        shell: bash
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ✓ PRODUCTION DEPLOYMENT SUCCESSFUL             ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  Branch: ${{ github.ref_name }}"
          echo "║  Commit: ${{ github.sha }}"
          echo "║  Actor: ${{ github.actor }}"
          echo "║  Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "╚══════════════════════════════════════════════════╝"
