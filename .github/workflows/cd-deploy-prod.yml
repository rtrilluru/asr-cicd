# ============================================================
# ASR CI/CD PIPELINE — CD: Deploy to PROD
# ============================================================
# Triggers: On push to 'master' branch (after merge from uat)
# Runs on: Self-hosted runner
# Gates: G9 (Dry-Run), G10 (Deploy), G11 (Object Validity),
#         G14 (Smoke Tests), G21 (Backup), G22 (Deploy Window),
#         G23 (Health Check), G24 (Prod Smoke), G25 (Performance)
# Approval: Requires 3 reviewers (DBA + Tech Lead + Release Manager)
# ============================================================

name: CD — Deploy to PROD

on:
  push:
    branches:
      - master
    paths:
      - 'migrations/**'
      - 'rollbacks/**'
      - 'packages/**'
      - 'schema/**'
      - 'scripts/**'
      - 'data/**'
      - 'apex/**'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to PROD Database
    runs-on: self-hosted
    environment: DB-PROD

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────
      # G22: Deployment Window Check
      # ────────────────────────────────────────────────────────
      - name: "Gate G22: Deployment Window Check"
        shell: bash
        run: |
          echo "::group::G22 — Deployment Window"
          HOUR=$(date +%H)
          if [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 22 ]; then
            echo "✓ Within deployment window (06:00-22:00 UTC)"
          else
            echo "::warning::Outside deployment window (current: ${HOUR}:00 UTC)"
            echo "Proceeding with caution — production deployment outside business hours"
          fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G23: Pre-Deploy Health Check
      # ────────────────────────────────────────────────────────
      - name: "Gate G23: Pre-Deploy Health Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G23 — Pre-Deploy Health Check"
          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_result VARCHAR2(100);
              v_count NUMBER;
          BEGIN
              -- Check 1: Database is responsive
              SELECT 'OK' INTO v_result FROM dual;
              DBMS_OUTPUT.PUT_LINE('✓ Database responsive');

              -- Check 2: Schema objects baseline
              SELECT COUNT(*) INTO v_count FROM user_objects WHERE status = 'VALID';
              DBMS_OUTPUT.PUT_LINE('✓ Valid objects count: ' || v_count);

              -- Check 3: No invalid objects before deploy
              SELECT COUNT(*) INTO v_count FROM user_objects WHERE status != 'VALID';
              IF v_count > 0 THEN
                  DBMS_OUTPUT.PUT_LINE('WARNING: ' || v_count || ' invalid objects before deployment');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ All objects VALID before deployment');
              END IF;

              -- Check 4: Tablespace has space
              DBMS_OUTPUT.PUT_LINE('✓ Pre-deploy health check passed');
          END;
          /
          EXIT
          EOSQL
          if [ $? -ne 0 ]; then echo "::error::G23 FAILED — Database not healthy"; echo "::endgroup::"; exit 1; fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Pre-Deploy: Tag current state
      # ────────────────────────────────────────────────────────
      - name: "Pre-Deploy: Tag database state"
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Tagging current database state"
          TAG_NAME="pre-prod-$(date +%Y%m%d-%H%M%S)"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          cd migrations
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<EOSQL
          liquibase tag -tag $TAG_NAME
          EXIT
          EOSQL
          echo "✓ Database tagged as: $TAG_NAME"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G21: Backup Verification
      # ────────────────────────────────────────────────────────
      - name: "Gate G21: Backup Verification"
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G21 — Backup Verification"
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_tag VARCHAR2(100);
              v_date TIMESTAMP;
          BEGIN
              SELECT TAG, DATEEXECUTED INTO v_tag, v_date
              FROM DATABASECHANGELOG
              WHERE TAG IS NOT NULL
              ORDER BY ORDEREXECUTED DESC
              FETCH FIRST 1 ROW ONLY;

              IF v_date > SYSTIMESTAMP - INTERVAL '10' MINUTE THEN
                  DBMS_OUTPUT.PUT_LINE('✓ Backup tag verified: ' || v_tag);
                  DBMS_OUTPUT.PUT_LINE('  Created: ' || TO_CHAR(v_date, 'YYYY-MM-DD HH24:MI:SS'));
              ELSE
                  DBMS_OUTPUT.PUT_LINE('WARNING: Latest tag is older than 10 minutes');
                  DBMS_OUTPUT.PUT_LINE('  Tag: ' || v_tag || ' at ' || TO_CHAR(v_date, 'YYYY-MM-DD HH24:MI:SS'));
              END IF;
          EXCEPTION
              WHEN NO_DATA_FOUND THEN
                  DBMS_OUTPUT.PUT_LINE('WARNING: No Liquibase tags found');
          END;
          /
          EXIT
          EOSQL
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G9: Dry-Run
      # ────────────────────────────────────────────────────────
      - name: "Gate G9: Dry-Run Migration"
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G9 — Dry-Run"
          cd migrations
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          liquibase update-sql -changelog-file db.changelog-master.xml
          EXIT
          EOSQL
          if [ $? -ne 0 ]; then echo "::error::G9 FAILED"; echo "::endgroup::"; exit 1; fi
          echo "✓ Dry-run successful"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G10: Execute Migration
      # ────────────────────────────────────────────────────────
      - name: "Gate G10: Execute Migration"
        id: deploy
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G10 — Execute Migration"
          cd migrations
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          liquibase update -changelog-file db.changelog-master.xml
          EXIT
          EOSQL
          if [ $? -ne 0 ]; then
            echo "DEPLOY_STATUS=failed" >> $GITHUB_ENV
            echo "::error::G10 FAILED"
            echo "::endgroup::"
            exit 1
          fi
          echo "DEPLOY_STATUS=success" >> $GITHUB_ENV
          echo "✓ Migration executed"
          echo "::endgroup::"

      - name: "Auto-Rollback (on deploy failure)"
        if: failure() && steps.deploy.outcome == 'failure'
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::warning::PROD DEPLOYMENT FAILED — Emergency rollback to: $TAG_NAME"
          cd migrations
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<EOSQL
          liquibase rollback -tag $TAG_NAME -changelog-file db.changelog-master.xml
          EXIT
          EOSQL
          echo "✓ Emergency rollback complete"

      # ────────────────────────────────────────────────────────
      # G11: Object Validity
      # ────────────────────────────────────────────────────────
      - name: "Gate G11: Object Validity Check"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G11 — Object Validity"
          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE v_invalid NUMBER;
          BEGIN
              SELECT COUNT(*) INTO v_invalid FROM user_objects WHERE status != 'VALID';
              IF v_invalid > 0 THEN
                  FOR rec IN (SELECT object_type, object_name FROM user_objects WHERE status != 'VALID') LOOP
                      DBMS_OUTPUT.PUT_LINE('  INVALID: ' || rec.object_type || ' — ' || rec.object_name);
                  END LOOP;
                  RAISE_APPLICATION_ERROR(-20001, v_invalid || ' invalid object(s)');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ All objects VALID');
              END IF;
          END;
          /
          EXIT
          EOSQL
          if [ $? -ne 0 ]; then echo "::error::G11 FAILED"; echo "::endgroup::"; exit 1; fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Deploy Shell Scripts
      # ────────────────────────────────────────────────────────
      - name: "Deploy Shell Scripts"
        shell: bash
        run: |
          echo "::group::Deploy Shell Scripts"
          if [ ! -d "scripts" ]; then echo "No scripts — skipping"; echo "::endgroup::"; exit 0; fi
          find scripts/ -name "*.sh" | while read -r script; do
            chmod +x "$script"
            echo "  ✓ Deployed: $script"
          done
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # APEX Import
      # ────────────────────────────────────────────────────────
      - name: "APEX Import"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          APEX_DIR="apex/applications/f100"
          if [ ! -d "$APEX_DIR" ] || [ ! -f "$APEX_DIR/install.sql" ]; then
            echo "No APEX export — skipping"
            exit 0
          fi
          echo "::group::APEX Import"
          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<EOSQL
          apex import -dir ${APEX_DIR} -applicationid 100
          EXIT
          EOSQL
          echo "✓ APEX application imported"
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G24: Production Smoke Tests
      # ────────────────────────────────────────────────────────
      - name: "Gate G24: Production Smoke Tests"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G24 — Production Smoke Tests"
          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_pass NUMBER := 0; v_fail NUMBER := 0; v_count NUMBER; v_result VARCHAR2(20);
          BEGIN
              -- Test 1: All PL/SQL objects valid
              SELECT COUNT(*) INTO v_count FROM user_objects
              WHERE object_type IN ('PACKAGE','PACKAGE BODY','FUNCTION','PROCEDURE','TRIGGER') AND status != 'VALID';
              IF v_count = 0 THEN DBMS_OUTPUT.PUT_LINE('✓ All PL/SQL objects VALID'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ ' || v_count || ' invalid PL/SQL objects'); v_fail := v_fail+1; END IF;

              -- Test 2: Package callable
              BEGIN PKG_CUSTOMER_LOAD.PROCESS_STAGING; DBMS_OUTPUT.PUT_LINE('✓ PROCESS_STAGING executed'); v_pass := v_pass+1;
              EXCEPTION WHEN OTHERS THEN DBMS_OUTPUT.PUT_LINE('✗ ' || SQLERRM); v_fail := v_fail+1; END;

              -- Test 3: Function callable
              BEGIN
                  SELECT FN_CUSTOMER_STATUS(1) INTO v_result FROM dual;
                  DBMS_OUTPUT.PUT_LINE('✓ FN_CUSTOMER_STATUS returned: ' || v_result); v_pass := v_pass+1;
              EXCEPTION WHEN OTHERS THEN DBMS_OUTPUT.PUT_LINE('✗ ' || SQLERRM); v_fail := v_fail+1; END;

              -- Test 4: Target table has data
              SELECT COUNT(*) INTO v_count FROM TGT_CUSTOMER;
              IF v_count > 0 THEN DBMS_OUTPUT.PUT_LINE('✓ TGT_CUSTOMER: ' || v_count || ' rows'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ TGT_CUSTOMER empty'); v_fail := v_fail+1; END IF;

              -- Test 5: Audit trigger active
              SELECT COUNT(*) INTO v_count FROM user_triggers
              WHERE trigger_name = 'TRG_CUSTOMER_AUDIT' AND status = 'ENABLED';
              IF v_count = 1 THEN DBMS_OUTPUT.PUT_LINE('✓ Audit trigger enabled'); v_pass := v_pass+1;
              ELSE DBMS_OUTPUT.PUT_LINE('✗ Audit trigger not enabled'); v_fail := v_fail+1; END IF;

              DBMS_OUTPUT.PUT_LINE('Production Smoke: ' || v_pass || ' passed, ' || v_fail || ' failed');
              IF v_fail > 0 THEN RAISE_APPLICATION_ERROR(-20024, v_fail || ' production smoke test(s) failed'); END IF;
          END;
          /
          EXIT
          EOSQL
          if [ $? -ne 0 ]; then echo "::error::G24 FAILED"; echo "::endgroup::"; exit 1; fi
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # G25: Performance Baseline
      # ────────────────────────────────────────────────────────
      - name: "Gate G25: Performance Baseline"
        shell: bash
        env:
          DB_OWNER_USER: ${{ secrets.DB_OWNER_USER }}
          DB_OWNER_PASSWORD: ${{ secrets.DB_OWNER_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::G25 — Performance Baseline"
          sql -S ${DB_OWNER_USER}/${DB_OWNER_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET SERVEROUTPUT ON
          DECLARE
              v_start TIMESTAMP;
              v_end   TIMESTAMP;
              v_elapsed NUMBER;
          BEGIN
              v_start := SYSTIMESTAMP;
              PKG_CUSTOMER_LOAD.PROCESS_STAGING;
              v_end := SYSTIMESTAMP;

              v_elapsed := EXTRACT(SECOND FROM (v_end - v_start));
              DBMS_OUTPUT.PUT_LINE('PROCESS_STAGING elapsed: ' || ROUND(v_elapsed, 3) || ' seconds');

              IF v_elapsed > 5 THEN
                  DBMS_OUTPUT.PUT_LINE('WARNING: Execution exceeded 5s threshold');
              ELSE
                  DBMS_OUTPUT.PUT_LINE('✓ Performance within acceptable range');
              END IF;
          END;
          /
          EXIT
          EOSQL
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Deployment Audit Record
      # ────────────────────────────────────────────────────────
      - name: "Record Deployment Audit"
        if: always()
        shell: bash
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: ${{ secrets.DB_CONNECTION }}
        run: |
          echo "::group::Deployment Audit"
          sql -S ${DB_USER}/${DB_PASSWORD}@${DB_CONNECTION} <<'EOSQL'
          SET LINESIZE 200
          SELECT ID, AUTHOR, TO_CHAR(DATEEXECUTED,'YYYY-MM-DD HH24:MI:SS') AS DATEEXECUTED,
                 ORDEREXECUTED, TAG
          FROM DATABASECHANGELOG
          ORDER BY ORDEREXECUTED DESC
          FETCH FIRST 10 ROWS ONLY;
          EXIT
          EOSQL
          echo "::endgroup::"

      # ────────────────────────────────────────────────────────
      # Production Deployment Summary
      # ────────────────────────────────────────────────────────
      - name: "PROD Deployment Summary"
        if: success()
        shell: bash
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ✓ PRODUCTION DEPLOYMENT SUCCESSFUL             ║"
          echo "╠══════════════════════════════════════════════════╣"
          echo "║  Tag: $TAG_NAME"
          echo "║  Gates: G9,G10,G11,G21,G22,G23,G24,G25"
          echo "║  Health Check: Passed"
          echo "║  Backup: Verified"
          echo "║  Performance: Baselined"
          echo "║  Commit: ${{ github.sha }}"
          echo "║  Actor: ${{ github.actor }}"
          echo "║  Time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "╚══════════════════════════════════════════════════╝"
